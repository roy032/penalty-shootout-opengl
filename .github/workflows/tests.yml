name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest pyflakes
      - run: python -m pyflakes shootout/rules.py shootout/physics.py shootout/keeper.py shootout/kick.py shootout/ai.py shootout/game.py shootout/stats.py shootout/audio.py tests tools
      - run: python -m pytest -q
